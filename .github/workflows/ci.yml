name: CI

# Static analysis and unit tests. Every other workflow in this repo is
# manual-only and builds artifacts, so without this nothing checks the code
# automatically.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Errors and warnings fail the build; infos do not.
      #
      # The tree is at zero findings locally, so gating on infos is tempting,
      # but CI tracks Flutter stable: each new stable can deprecate an API and
      # turn CI red with no code change. That already happened here, with
      # cacheExtent -> scrollCacheExtent, whose replacement does not exist in
      # the older stable this project builds against. Deprecation notices
      # should not block merges.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
