name: CI

# Static analysis and unit tests. Every other workflow in this repo is
# manual-only and builds artifacts, so without this nothing checks the code
# automatically.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # The tree is at zero analyzer findings, so this gates on everything
      # including infos. If a generator starts emitting new lints, exclude the
      # generated path in analysis_options.yaml rather than weakening this.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
