name: mindstack
base: core22
adopt-info: puzzle
summary: 161 minimalist brain puzzles, one swipe away
description: |
  Mindstack is a vertical-feed suite of 161 minimalist brain puzzles spanning
  logic, math, memory, spatial, attention and word games.

confinement: strict
grade: stable

apps:
  mindstack:
    command: puzzle
    extensions: [gnome]
    desktop: snap/gui/com.medhub.mindstack.desktop
    plugs:
      - home

parts:
  puzzle:
    source: .
    plugin: flutter
    override-pull: |
      snapcraftctl pull
      snapcraftctl set-version $(grep 'version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
    flutter-target: lib/main.dart
    flutter-channel: stable
    build-packages:
      - libgtk-3-dev
      - liblzma-dev
      - pkg-config
      - default-jdk
  metadata:
    plugin: dump
    source: snap/local
    organize:
      com.medhub.mindstack.metainfo.xml: usr/share/metainfo/com.medhub.mindstack.metainfo.xml
